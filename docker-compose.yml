services:
  bullet-journal:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3003:3003"
    networks:
      - bullet-journal-network
    volumes:
      - ./:/code
      - node_modules:/code/node_modules
    environment:
      - DB_USER=bujo
      - DB_PASSWORD="bujopass"
      - DB_NAME=bujo_dev
      - DB_HOST=postgres
  postgres:
    image: postgres:16
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - bullet-journal-network
    environment:
      - POSTGRES_USER=bujo
      - POSTGRES_PASSWORD="bujopass"
      - POSTGRES_DB=bujo_dev
      - POSTGRES_HOST=postgres
    ports:
      - "5432:5432"
volumes:
  pgdata:
  node_modules:
networks:
  bullet-journal-network:
